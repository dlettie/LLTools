<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROI Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f8fa;
  --surface: #ffffff;
  --border: #e7e9ef;
  --text: #1a1d29;
  --muted: #6b7280;
  --accent: #14b8a6;
  --sans: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.card {
  width: 100%;
  max-width: 620px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
}
h1 {
  margin: 0 0 8px;
  font-size: 1.35rem;
}
p {
  margin: 0 0 18px;
  color: var(--muted);
  line-height: 1.5;
}
a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
}
a:hover {
  text-decoration: underline;
}
</style>
</head>
<body>
  <div class="card">
    <h1>ROI Studio</h1>
    <p>This entry point is ready. Add your ROI Studio HTML file to this folder and update this page to launch it.</p>
    <a href="../index.html">Back to LLTools</a>
  </div>
</body>
</html>
